<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>将棋Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Yuji+Mai&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#e7e9ec;--surface:#f7f8fa;--ink:#161c28;--muted:#5b6475;--line:#c6ccd6;--line-strong:#8f98a8;
  --accent:#2448c4;--accent-soft:rgba(36,72,196,.14);--shu:#c0392b;
  --g-best:#0f8a5f;--g-good:#2a6fd6;--g-norm:#7b8494;--g-dub:#c28100;--g-bad:#c2352b;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --wood:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='700'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='0.09 0.0035' numOctaves='3' seed='11'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.25  0 0 0 0 0.05  0 0 0 0.5 0'/></filter><rect width='100%25' height='100%25' filter='url(%23f)'/></svg>");
  --wood2:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='300'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='0.004 0.12' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0 0.02  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23f)'/></svg>");
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11151c;--surface:#181d26;--ink:#e4e8ef;--muted:#8e97a8;--line:#2a3140;--line-strong:#465065;--accent:#7b97ff;--accent-soft:rgba(123,151,255,.18);}}
:root[data-theme="dark"]{--paper:#11151c;--surface:#181d26;--ink:#e4e8ef;--muted:#8e97a8;--line:#2a3140;--line-strong:#465065;--accent:#7b97ff;--accent-soft:rgba(123,151,255,.18);}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px clamp(14px,3vw,32px)}
.logo{font-family:var(--serif);font-weight:800;font-size:22px;letter-spacing:.06em;display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.logo small{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.tabs{display:flex;margin-left:auto;border:1px solid var(--line-strong)}
.tabs button{background:none;border:0;padding:7px 18px;font-weight:500;font-size:14px;white-space:nowrap}
.tabs button+button{border-left:1px solid var(--line-strong)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.snd{background:none;border:1px solid var(--line-strong);width:36px;height:36px;display:flex;align-items:center;justify-content:center;padding:0}
.snd svg{width:18px;height:18px}
main{max-width:1200px;margin:0 auto;padding:22px clamp(12px,3vw,32px) 60px}
.view[hidden]{display:none!important}
.stage{display:grid;grid-template-columns:minmax(0,580px) minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);padding:20px 22px;min-width:0}
.panel h2{font-family:var(--serif);font-weight:800;font-size:22px;line-height:1.35;margin:0 0 12px}
.panel p{margin:0 0 .8em}.panel ul{margin:0 0 .8em;padding-left:1.2em}.panel li{margin:.25em 0}
.seq{font-family:var(--serif);font-weight:600;background:var(--paper);padding:8px 12px;border-left:3px solid var(--accent)}
table.vt{border-collapse:collapse;margin:4px 0 12px}table.vt td{border:1px solid var(--line);padding:4px 12px;text-align:center}
table.vt td:nth-child(odd){font-family:var(--serif);font-weight:800}
/* ===== board ===== */
.bwrap{width:100%;max-width:580px;margin:0 auto;user-select:none;-webkit-user-select:none}
.hand{display:flex;align-items:center;gap:8px;min-height:58px;padding:6px 10px;margin:6px 0;
  background:var(--wood2),linear-gradient(180deg,#9b6a33,#7d5226);border-radius:3px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.15),0 2px 4px rgba(0,0,0,.2)}
.hand .who{font-size:12px;color:#f5e3c0;width:42px;flex:none;line-height:1.2;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.hand .chips{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;align-items:center}
.hand .none{font-size:12px;color:rgba(245,227,192,.6)}
.chip{position:relative;width:40px;height:46px;border:0;background:none;padding:0;transition:transform .15s}
.chip .pc{width:100%;height:100%}
.chip:not([tabindex="-1"]):hover{transform:translateY(-3px)}
.chip .n{position:absolute;right:-6px;bottom:-4px;font-size:11px;font-weight:700;background:#1d140a;color:#f6e7c6;min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:9px;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.chip.sel{transform:translateY(-6px) scale(1.06)}
.chip.sel .pc{filter:drop-shadow(0 6px 5px rgba(0,0,0,.45)) drop-shadow(0 0 6px rgba(120,160,255,.9))}
.files{position:absolute;left:3.4cqw;right:3.4cqw;top:0;height:3.4cqw;display:grid;grid-template-columns:repeat(9,1fr);font-size:2.2cqw;line-height:3.5cqw;color:#5a3a0e;text-align:center;font-family:var(--serif);font-weight:600}
.ranks{position:absolute;right:0;top:3.4cqw;bottom:3.4cqw;width:3.4cqw;display:grid;grid-template-rows:repeat(9,1fr);font-size:2.2cqw;color:#5a3a0e;align-items:center;text-align:center;font-family:var(--serif);font-weight:600}
.inner{padding:3.4cqw}
.bin{position:relative;container-type:inline-size;
  background:var(--wood),radial-gradient(120% 90% at 30% 20%,#f0cd85,#dcae5c 60%,#c99a48);
  border-radius:2px;box-shadow:0 1px 0 #f6dca2 inset,0 0 0 1px #8b6122,0 7px 0 -1px #a57630,0 8px 0 0 #6e4a17,0 18px 28px rgba(0,0,0,.38)}
.bin.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.board{position:relative;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);aspect-ratio:1/1.09;border:1.6px solid #2a1a06}
.cell{position:relative;border-right:1px solid rgba(35,22,4,.78);border-bottom:1px solid rgba(35,22,4,.78);display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;cursor:default}
.cell:nth-child(9n){border-right:0}.cell:nth-child(n+73){border-bottom:0}
.cell.star::after{content:"";position:absolute;width:6px;height:6px;background:#2a1a06;border-radius:50%;right:-3.5px;bottom:-3.5px;z-index:1}
.cell.last{background:radial-gradient(circle,rgba(255,190,70,.55),rgba(255,170,40,.22))}
.cell.mark{box-shadow:inset 0 0 0 2.5px var(--accent)}
.cell.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{background:rgba(255,215,90,.55);box-shadow:inset 0 0 12px rgba(255,200,60,.9)}}
.cell.selc{background:rgba(36,72,196,.22)}
.cell.tgt{cursor:pointer}
.cell.tgt::before{content:"";position:absolute;width:26%;height:24%;border-radius:50%;background:rgba(30,60,170,.55);box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.cell.tgt.occ::before{width:92%;height:92%;border-radius:4px;background:transparent;box-shadow:inset 0 0 0 3px rgba(30,60,200,.8)}
.cell.can{cursor:pointer}
.pc{position:relative;width:calc(92% * var(--s,1));height:calc(95% * var(--s,1));display:block;filter:drop-shadow(1px 2.5px 1.5px rgba(40,20,0,.45));transition:transform .15s,filter .15s}
.pc svg{display:block;width:100%;height:100%;overflow:visible}
.pc.gote{transform:rotate(180deg);filter:drop-shadow(-1px -2.5px 1.5px rgba(40,20,0,.45))}
.cell.can:hover .pc:not(.gote),.cell.selc .pc:not(.gote){transform:translateY(-5%) scale(1.05);filter:drop-shadow(2px 7px 4px rgba(40,20,0,.45))}
.cell.selc .pc:not(.gote){transform:translateY(-9%) scale(1.09)}
svg.arrows{position:absolute;left:3.4cqw;top:3.4cqw;width:calc(100% - 6.8cqw);height:calc(100% - 6.8cqw);pointer-events:none;overflow:visible;z-index:6}
.fx{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:visible}
.stamp{position:absolute;left:50%;top:50%;font-family:var(--serif);font-weight:800;font-size:15cqw;color:#c0261a;white-space:nowrap;
  -webkit-text-stroke:1.5px #fff6e0;text-shadow:0 4px 0 rgba(0,0,0,.25),0 0 30px rgba(255,80,40,.6);animation:stamp 1.25s cubic-bezier(.2,1.3,.35,1) forwards}
.stamp.mate{font-size:22cqw;animation-duration:2s}
.stamp.ok{color:#0e7a55;text-shadow:0 4px 0 rgba(0,0,0,.2),0 0 30px rgba(60,220,150,.6)}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4) rotate(-12deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(.94) rotate(-4deg)}28%{transform:translate(-50%,-50%) scale(1.02) rotate(-4deg)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}}
.vign{position:absolute;inset:0;background:radial-gradient(circle,transparent 30%,rgba(190,20,10,.45));animation:vign 1.1s ease-out forwards}
@keyframes vign{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.ripple{position:absolute;border:2px solid rgba(255,240,200,.95);border-radius:50%;pointer-events:none;animation:ripple .5s ease-out forwards}
@keyframes ripple{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.part{position:absolute;width:9px;height:9px;pointer-events:none}
.ghost{position:fixed;z-index:50;pointer-events:none}
.promo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(10,14,22,.5);z-index:12;backdrop-filter:blur(1.5px)}
.promo[hidden]{display:none}
.promo button{background:var(--surface);border:1px solid var(--line-strong);padding:10px 16px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 20px rgba(0,0,0,.35);animation:pop .2s ease-out}
.promo button .pc{width:46px;height:52px}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
/* ===== index ===== */
.intro{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:end;margin:8px 0 26px}
.intro h1{font-family:var(--serif);font-weight:800;font-size:clamp(30px,5vw,50px);line-height:1.15;margin:0;letter-spacing:.02em}
.intro p{margin:0;color:var(--muted);max-width:38em}
.heropcs{display:flex;gap:10px;margin-top:18px}
.heropcs .pc{width:46px;height:52px;animation:drop .7s cubic-bezier(.3,1.5,.5,1) backwards}
.heropcs .pc:nth-child(2){animation-delay:.12s}.heropcs .pc:nth-child(3){animation-delay:.24s}.heropcs .pc:nth-child(4){animation-delay:.36s}
@keyframes drop{0%{transform:translateY(-40px) rotate(-10deg);opacity:0}100%{transform:none;opacity:1}}
@media (max-width:700px){.intro{grid-template-columns:1fr;gap:10px}}
.chapters{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-strong)}
.chapters li{border-bottom:1px solid var(--line)}
.chapters .no{font-family:var(--serif);font-weight:800;font-size:34px;color:var(--line-strong);line-height:1}
.chapters .ti{font-weight:700;font-size:17px;display:block}
.chapters .su{color:var(--muted);font-size:13px}
.chapters .pr{font-size:12px;color:var(--muted);text-align:right;min-width:90px}
.chapters .bar{display:block;height:3px;background:var(--line);margin-top:5px}
.chapters .bar i{display:block;height:100%;background:var(--accent)}
.chapters .done .no{color:var(--accent)}
.chapters .new{font-size:11px;font-weight:700;color:#fff;background:var(--shu);padding:0 6px;margin-left:8px;vertical-align:2px}
/* ===== lesson ===== */
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.crumb button{background:none;border:1px solid var(--line-strong);padding:3px 12px}
.steps{display:flex;gap:3px;margin:0 0 14px}
.steps i{flex:1;height:4px;background:var(--line)}.steps i.cur{background:var(--ink)}.steps i.ok{background:var(--accent)}
.quiz{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.qtag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;background:var(--ink);color:var(--paper);margin-bottom:8px}
.qtag.nx{background:var(--shu)}
.fb{margin-top:12px;padding:12px 14px;border-left:3px solid var(--line-strong);background:var(--paper);animation:fbin .3s ease-out}
@keyframes fbin{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
.fb.ok{border-color:var(--g-best)}.fb.ng{border-color:var(--g-bad)}
.fb b.h{display:block;font-family:var(--serif);font-size:18px;margin-bottom:4px}
.fb.ok b.h{color:var(--g-best)}.fb.ng b.h{color:var(--g-bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:7px 16px;font-weight:500;font-size:14px;transition:border-color .15s,transform .1s}
.btn:hover{border-color:var(--ink)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.nav{display:flex;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.bstep{margin:14px 0 8px;padding:14px 16px;background:var(--paper);border-left:4px solid var(--accent)}
.bstep .k{font-size:12px;color:var(--muted)}
.bstep .ins{font-family:var(--serif);font-weight:800;font-size:20px;line-height:1.4;display:block}
.bstep .why{font-size:13px;color:var(--muted)}
.bstep.anim{animation:fbin .3s ease-out}
.blist{list-style:none;margin:8px 0 0;padding:0;font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.blist li{display:flex;gap:6px;align-items:baseline;color:var(--muted)}
.blist li.d{color:var(--ink)}.blist li.d::before{content:"";width:8px;height:8px;background:var(--accent);flex:none;transform:translateY(-1px)}
.blist li:not(.d)::before{content:"";width:8px;height:8px;border:1px solid var(--line-strong);flex:none;transform:translateY(-1px)}
.blist li.c{color:var(--accent);font-weight:700}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.tog input{accent-color:var(--accent)}
/* ===== play ===== */
.seg{display:flex;border:1px solid var(--line-strong);margin:6px 0 14px}
.seg button{flex:1;background:none;border:0;padding:8px 4px;font-size:14px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
.lvdesc{font-size:12px;color:var(--muted);margin:-8px 0 14px}
.evalbar{position:relative;height:12px;background:#2b2f38;margin:4px 0 6px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.evalbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#fffdf6,#e9e3d3);transition:width .7s cubic-bezier(.3,1.2,.4,1)}
.evalbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--accent)}
.evaltxt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.evaltxt b{color:var(--ink);font-size:16px}
.grade{position:relative;overflow:hidden;margin:16px 0 10px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;min-height:78px;padding:12px 14px;background:var(--paper);border-left:4px solid var(--g-norm)}
.grade .gw{font-family:var(--serif);font-weight:800;font-size:32px;line-height:1;grid-row:span 2}
.grade .gm{font-weight:700}.grade .gd{font-size:13px;color:var(--muted)}
.grade.anim .gw{animation:gstamp .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes gstamp{0%{transform:scale(2.2) rotate(-10deg);opacity:0}100%{transform:none;opacity:1}}
.grade.anim.best::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,230,140,.55) 50%,transparent 70%);animation:shine 1.1s ease-out .2s backwards;transform:translateX(-100%)}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.grade.anim.bad,.grade.anim.dub{animation:shake .45s .15s}
.grade.empty{border-left-color:var(--line);color:var(--muted);display:flex;font-size:14px}
.status{font-size:13px;color:var(--muted);min-height:1.7em;display:flex;align-items:center;gap:8px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;background:var(--accent);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.kifu{max-height:240px;overflow-y:auto;border-top:1px solid var(--line);margin-top:12px;font-size:14px}
.kifu button{display:grid;grid-template-columns:34px 1fr auto;gap:8px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.kifu button:hover,.kifu button.on{background:var(--accent-soft)}
.kifu .k{color:var(--muted);font-size:12px}
.tag{font-size:12px;font-weight:700;padding:0 6px;color:#fff}
.graph{width:100%;height:70px;display:block;margin-top:10px;border-top:1px solid var(--line)}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0;text-align:center}
.summary div{background:var(--paper);padding:6px 2px}
.summary b{display:block;font-family:var(--serif);font-size:22px;line-height:1.2}
.summary span{font-size:12px}
.result{font-family:var(--serif);font-weight:800;font-size:26px;margin:4px 0;animation:gstamp .6s cubic-bezier(.2,1.5,.4,1)}
.note{font-size:12px;color:var(--muted);margin-top:14px}
/* next-move list */
.nlhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line-strong);padding-bottom:12px}
.nlhead h2{font-family:var(--serif);font-weight:800;font-size:28px;margin:0;line-height:1.2}
.nlhead p{margin:4px 0 0}
.nlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ncard{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);padding:12px;transition:border-color .15s,transform .15s,box-shadow .15s}
.ncard:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.ncard svg{width:104px;height:auto;display:block;box-shadow:0 2px 0 #8b6122,0 4px 8px rgba(0,0,0,.25)}
.ncard .nno{font-family:var(--serif);font-weight:800;font-size:13px;color:var(--muted)}
.ncard .nt{display:block;font-weight:700;font-size:15px;line-height:1.4;margin:2px 0 6px}
.ncard .nq{display:block;font-size:12px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ncard .ns{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;padding:1px 8px;border:1px solid var(--line-strong);color:var(--muted)}
.ncard.solved .ns{background:var(--g-best);border-color:var(--g-best);color:#fff}

 {t:'問題：最初の一手',sfen:INIT,quiz:{type:'answer',ans:['7g7f','2g2f'],q:'初手によく指される代表的な手を指してみよう（2つのうちどちらでも正解）。',hint:'角を働かせる手か、飛車を働かせる手。',ok:'▲７六歩は角道を開ける手、▲２六歩は飛車先を伸ばす手。プロの対局でも初手はこの2つが大半。'}},
 {t:'居飛車と振り飛車',sfen:MINO,marks:['6h','2h'],body:`<p>飛車を2筋のまま使うのが<b>居飛車</b>、左へ移動させるのが<b>振り飛車</b>。</p><p>振り飛車は移動先で名前が変わる：５筋＝中飛車、６筋＝<b>四間飛車</b>、７筋＝三間飛車、８筋＝向かい飛車。</p><p>図は四間飛車。飛車を左に振ったぶん、玉を右側に囲える。振り飛車は相手の攻めを受け止めてカウンターを狙うのが基本方針で、方針が分かりやすい<b>四間飛車＋美濃囲い</b>は入門向きとよく言われる。</p>`},
 {t:'居飛車の駒組みの例',sfen:FUNA,marks:['7h','6h','5h','6i'],body:`<p>居飛車の基本的な手順の一例：</p><p class="seq">▲７六歩 → ▲２六歩 → ▲４八銀 → ▲６八玉 → ▲７八玉 → ▲５八金右 → ▲６八銀</p><p>図の囲いが<b>舟囲い</b>。ここから急戦（早めの攻め）に出るか、矢倉や穴熊へ発展させてじっくり戦うかを選ぶ。</p><p>役割分担を意識しよう。<b>飛・角・銀・桂は攻め</b>、<b>金・銀は守り</b>が基本。</p>`},
 {t:'序盤の格言',sfen:INIT,body:`<ul><li><b>飛車先の歩交換三つの得あり</b>　歩を持ち駒にでき、飛車が前に出られ、相手陣に傷を作れる</li><li><b>角筋に玉を置くな</b>　角のラインに玉がいると、王手と何かの両取り（王手飛車など）を食らいやすい</li><li><b>玉飛接近すべからず</b>　飛車の近くは戦場になる</li><li><b>攻めは飛角銀桂、守りは金銀三枚</b>　攻めと守りの役割分担</li></ul>`},
]},
{id:'c3',title:'囲いを知る',sum:'舟囲い・美濃・矢倉・穴熊',pages:[
 {t:'舟囲い',sfen:FUNA,marks:['7h','6h','5h','6i'],body:`<p>居飛車の最も手軽な囲い。少ない手数で組めるので、すぐに攻めたい<b>急戦</b>向き。</p><p>弱点は<b>横と上からの攻めに薄い</b>こと。持久戦になったら矢倉や穴熊に組み替えることが多い。</p>`},
 {t:'美濃囲い',sfen:MINO,marks:['2h','3h','4i','5h'],body:`<p>振り飛車の代表的な囲い。玉を２八、銀を３八、金を４九と５八に配置する。</p><p>飛車による<b>横からの攻めに非常に強い</b>のが特長。弱点は<b>端</b>と、玉頭（玉の真上）からの攻め。居飛車側は端攻めで美濃を崩すのが定番。</p>`},
 {t:'矢倉囲い',sfen:YAGURA,marks:['8h','7h','7g','6g'],body:`<p>相居飛車（お互い居飛車）の代表的な囲い。金銀3枚で玉を包む。</p><p><b>上からの攻めに強く</b>、陣形のバランスが良い。組むのに手数がかかるので、相手の急戦に注意が必要。</p>`},
 {t:'穴熊',sfen:ANA,marks:['9i','8h','7h','7i'],body:`<p>玉を隅に潜らせ、金銀で蓋をする最も堅い囲い。<b>王手がかかりにくい</b>ので、終盤は駒損してでも攻めを優先できる。</p><p>弱点は手数がかかることと、<b>端攻め</b>。格言「穴熊の姿焼き」は、囲いを崩されて隅で詰まされる負け方のこと。</p>`},
 {t:'問題：美濃囲いを完成させる',sfen:'4k4/9/9/9/9/2P2P3/PPBPP1PPP/2SRG2K1/LN3GSNL b - 1',marks:['2h'],quiz:{type:'answer',ans:['3i3h'],q:'あと1手で美濃囲いが完成する。どの駒をどこへ動かす？',hint:'玉の左隣が空いている。',ok:'▲３八銀で美濃囲いの完成。銀が玉の横を守り、金２枚と連結する。'}},
 {t:'囲いの選び方',sfen:INIT,body:`<p>囲いは「相手がどこから攻めてくるか」で選ぶ。</p><ul><li>横から攻められやすい（相手が居飛車で飛車を横に使う）→ <b>美濃</b></li><li>上から攻められやすい（相居飛車の銀や歩の攻め）→ <b>矢倉</b></li><li>とにかく堅くして終盤勝負 → <b>穴熊</b></li></ul><p>逆に、相手の囲いの<b>弱点</b>（美濃なら端と玉頭、穴熊なら端）を知っておくと攻め方が見えてくる。</p>`},
]},
{id:'c4',title:'攻めの基本',sum:'数の攻めと棒銀',pages:[
 {t:'数の攻め',sfen:BOGIN,marks:['2c'],body:`<p>攻めの原則は<b>「数の攻め」</b>。ある地点に利いている自分の駒が、そこを守る相手の駒より多ければ突破できる。</p><p>図なら２三の地点。先手は歩・銀・飛車を集め、後手が金銀で守りに来るより先に、攻め駒の数を上回らせてから仕掛ける。足りないうちに仕掛けると、駒を損するだけで終わる。</p>`},
 {t:'棒銀',sfen:BOGIN,arrows:[['2f','1e'],['2e','2d']],body:`<p>銀を２筋へまっすぐ進め、飛車と協力して攻める戦法。分かりやすく強力なので、まず覚えたい攻め方。</p><p class="seq">▲３八銀 → ▲２七銀 → ▲２六銀 → ▲１五銀（または▲２五銀）</p><p>銀が出たら▲２四歩と突き、△同歩▲同銀と進めて、飛・銀・歩の数で２筋を破る。相手が守りを固めたら端（１筋）に狙いを移すのも定番。</p>`},
 {t:'歩の突き捨て',sfen:BOGIN,marks:['2e','2d'],body:`<p>攻める前に歩を突いて、わざと取らせる手を<b>突き捨て</b>という。</p><ul><li>大駒（飛・角）の通り道を開ける</li><li>相手の歩を前に釣り出して形を乱す</li><li>交換で持ち歩が増え、あとで「叩き」や「垂れ歩」に使える</li></ul><p>格言「<b>開戦は歩の突き捨てから</b>」。いきなり駒をぶつけるより、まず歩で相手陣を揺さぶる。</p>`},
 {t:'攻めの格言',sfen:BOGIN,body:`<ul><li><b>大駒は離して打て</b>　飛・角は遠くから利かせた方が取られにくく、働きも大きい</li><li><b>と金の遅早</b>　と金攻めは遅そうに見えて、実は確実で速い</li><li><b>桂の高跳び歩の餌食</b>　桂馬を跳ねすぎると歩で取られる</li><li><b>攻めは足りているか確認</b>　攻め駒が2枚だけの攻めは切れやすい。3枚以上を目安に</li></ul>`},
]},
{id:'c5',title:'歩の手筋',sum:'たった1枚の歩で局面を変える',pages:[
 {t:'叩きの歩',sfen:'6k2/7g1/9/9/9/9/9/7R1/4K4 b P 1',marks:['2c'],body:`<p>相手の駒の頭（真正面）に歩を打つ手。図で▲２三歩と打つと、</p><ul><li>△同金と取れば、▲同飛成で金を取れる（図のように飛車が利いている場合）</li><li>飛車が利いていなくても、金が上ずって玉から離れ、守りが弱くなる</li><li>取らなければ▲２二歩成で金を取れる</li></ul><p>どれでも得をする。持ち歩があるときはまず候補に入れたい。</p>`},
 {t:'垂れ歩',sfen:'4k1s2/9/9/7P1/9/9/9/7R1/4K4 b - 1',arrows:[['2d','2c']],body:`<p>次の一手で成れる位置に歩を打っておく手。図の２四の歩がそれ。</p><p>次に▲２三歩成とすれば、と金が相手陣に入り込む。直接取られにくい場所に打つのがコツで、相手は受けに手番を使わされる。</p><p>と金は取られても歩1枚の損で済むので、相手にとって非常に嫌な攻め。</p>`},
 {t:'継ぎ歩',sfen:'4k4/9/7p1/9/7P1/9/9/7R1/4K4 b P 1',marks:['2e','2d'],body:`<p>歩を突き捨てたあと、同じ筋にさらに歩を打って攻めを続ける手。</p><p class="seq">▲２四歩 △同歩 ▲２五歩（継ぎ歩）</p><p>相手が▲２五歩を取ると歩がさらに前に出てきて形が乱れ、取らなければ▲２四歩と取り込んで攻めが続く。飛車の前で歩を連打するのが典型形。</p>`},
 {t:'問題：底歩で守る',sfen:'4k4/9/9/9/9/9/PPPP5/1K7/3G4+r b P 1',marks:['6i'],quiz:{type:'answer',ans:['P*5i','P*4i','P*3i','P*2i'],q:'後手の龍が横から６九の金を狙っている。持ち駒の歩で守ろう。',hint:'自陣の一番下の段に打つ。',ok:'自陣の最下段に打つ歩を<b>底歩</b>という。龍の横の利きを止め、しかも歩なので取られても損が少ない。飛車や龍の横からの攻めに特に強い。金のすぐ横（▲５九歩）に打つと、金が歩を支えてより安定する。'}},
]},
{id:'c6',title:'両取りの手筋',sum:'1手で2つを狙う',pages:[
 {t:'両取りは最強の得',sfen:INIT,body:`<p>1手で2つの駒を同時に狙うのが<b>両取り</b>。相手は1手で片方しか逃がせないので、ほぼ確実に駒得できる。</p><p>中でも<b>王手</b>との両取りは強力。王手は必ず受けなければならないので、もう一方は必ず取れる（王手飛車、王手金取りなど）。</p><p>次の4問で代表的な形を覚えよう。</p>`},
 {t:'問題：王手飛車',sfen:'6g2/1r5k1/9/9/9/9/9/9/4K4 b B 1',quiz:{type:'answer',ans:['B*5e'],q:'持ち駒の角で、後手の玉と飛車を同時に狙おう。',hint:'玉と飛車は同じ２段目にいる。斜めのラインが交わる場所は？',ok:'▲５五角打が<b>王手飛車</b>。玉が逃げたら飛車を取れる。玉と飛車が同じ斜め線に並ぶ形は常に警戒しよう（自分の玉も同じ）。'}},
 {t:'問題：ふんどしの桂',sfen:'k2s1g3/9/9/9/9/9/9/9/4K4 b N 1',quiz:{type:'answer',ans:['N*5c'],q:'持ち駒の桂で、金と銀を同時に狙おう。',hint:'桂馬は2マス前の左右に利く。',ok:'▲５三桂打で金と銀の両取り。この形を<b>ふんどしの桂</b>という。桂は駒を飛び越えるので、間に駒を置いて防ぐこともできない。'}},
 {t:'問題：割り打ちの銀',sfen:'k8/9/3g1g3/4P4/9/9/9/9/4K4 b S 1',quiz:{type:'answer',ans:['S*5b'],q:'持ち駒の銀で、2枚の金を同時に狙おう。',hint:'銀は斜め後ろにも動ける。金は斜め後ろに動けない。',ok:'▲５二銀打が<b>割り打ちの銀</b>。銀の斜め後ろの利きで2枚の金を狙う。金は斜め後ろに動けないので、この銀を取れない。'}},
 {t:'問題：十字飛車',sfen:'k8/4s4/9/9/7g1/9/9/9/4K4 b R 1',quiz:{type:'answer',ans:['R*5e','R*9e','R*2a','R*2b','R*5a'],q:'持ち駒の飛車で、銀と金を同時に狙おう。',hint:'飛車は縦と横に利く。銀の筋と金の段が交わる場所は？',ok:'▲５五飛打なら縦で銀、横で金を狙う<b>十字飛車</b>。他にも▲９五飛打（王手金取り）など、縦横の利きで2つを狙う手はすべて正解。'}},
]},
{id:'c7',title:'寄せと1手詰',sum:'玉を追い詰める考え方',pages:[
 {t:'寄せの格言',sfen:'4k4/9/4P4/9/9/9/9/9/4K4 b G 1',marks:['5b'],body:`<ul><li><b>玉は下段に落とせ</b>　玉を一番下（相手から見て奥）に追い込むと逃げ場が少ない</li><li><b>王手は追う手</b>　むやみに王手をすると玉が広い場所へ逃げてしまう</li><li><b>玉は包むように寄せよ</b>　逃げ道を先に塞いでから迫る</li><li><b>金はとどめに残せ</b>　金は最後の一押し（頭金など）で最も役立つ</li></ul>`},
 {t:'詰めろと必至',sfen:'4k4/9/4P4/9/9/9/9/9/4K4 b G 1',body:`<p><b>詰めろ</b>：次に詰ます手があるぞ、という状態。相手は受けなければならない。</p><p><b>必至</b>：どう受けても次に詰む状態。こうなれば、自分の玉が先に詰まない限り勝ち。</p><p>終盤は「相手玉に詰めろをかけつつ、自玉は詰まない」状態を作るのが目標。</p>`},
 {t:'問題：頭金',sfen:'4k4/9/4P4/9/9/9/9/9/4K4 b G 1',quiz:{type:'mate1',q:'1手で詰ませよう。',hint:'歩が支えになる。',ok:'▲５二金打の<b>頭金</b>。玉の真上に金を打ち、歩で支える最も基本的な詰み形。'}},
 {t:'問題：龍の詰み',sfen:'7nk/6+R2/8P/9/9/9/9/9/4K4 b - 1',quiz:{type:'mate1',q:'1手で詰ませよう。',hint:'龍は斜めにも1マス動ける。歩の支えを使う。',ok:'▲１二龍（歩が支えている）で詰み。▲１二歩成も、龍が１二に利いているので詰み。隣の桂が玉の逃げ道を塞いでいる点に注目。'}},
 {t:'問題：桂で詰ます',sfen:'7gk/8p/6S2/9/9/9/9/9/4K4 b N 1',quiz:{type:'mate1',q:'1手で詰ませよう。',hint:'桂は駒を飛び越えて利く。銀が２二を押さえている。',ok:'▲２三桂打で詰み。金も歩も桂を取れず、逃げ道の２二は銀が押さえている。自分の駒が玉の逃げ道を塞いでいる形は桂の詰みが生まれやすい。'}},
 {t:'問題：大駒は離して打て',sfen:'7bk/8p/9/9/9/9/9/9/K8 b B 1',quiz:{type:'mate1',q:'1手で詰ませよう。',hint:'２二に打つと玉に取られる。',ok:'角を２二から離した斜めのライン（▲３三角〜▲８八角）に打てば詰み。近くに打つと取られる。<b>大駒は離して打て</b>の典型。'}},
 {t:'速度計算',sfen:INIT,body:`<p>終盤は、お互いの玉が詰むまでの手数を比べる<b>速度計算</b>が大切。</p><ul><li>自玉が安全（詰めろでない）なら、相手玉に最速で迫る</li><li>自玉が詰めろなら、受けるか、王手の連続で先に詰ます</li><li>迷ったら、1手で2つ以上の意味がある手（攻防の手）を探す</li></ul><p>実戦モードでは、評価値の急な変化がこの計算ミスのサインになる。</p>`},
]},
{id:'c8',title:'3手詰に挑戦',sum:'王手→応手→とどめ',pages:[
 {t:'問題：3手詰 その1',sfen:'k8/9/2G6/9/9/9/9/9/K8 b BS 1',quiz:{type:'mate3',q:'王手の連続で3手で詰ませよう。相手の応手はCPUが指す。',hint:'まず銀で玉を追い、角でとどめ。',ok:'▲８二銀打 △９二玉 ▲８一角打（角を離して打っても詰み）。銀は金が支えているので取られない。'}},
 {t:'問題：3手詰 その2',sfen:'9/1k1+B5/9/9/9/9/9/9/K8 b RG 1',quiz:{type:'mate3',q:'王手の連続で3手で詰ませよう。',hint:'馬が７二に利いている。',ok:'▲７二飛打。馬が支えているので取れず、どこへ逃げても金を打って詰み（例：△９三玉 ▲８四金打）。'}},
 {t:'問題：3手詰 その3',sfen:'1k1S5/9/9/9/9/9/9/9/K8 b RG 1',quiz:{type:'mate3',q:'王手の連続で3手で詰ませよう。',hint:'飛車は離して打つ。',ok:'▲８三飛打。△９二玉/△９一玉には▲８二金打、△７一玉には▲７二金打で詰み。銀が上部を押さえているのがポイント。'}},
]},
];

    h.fresh=true;const big=h.grade==='best'||h.grade==='bad';if(big)PB.bigFx(h.grade,m.to);if(checkEnd())return;
    ask('threat',{sfen:toSfen(G.pos),sw:true,ply:5,t:450}).then(t=>{if(tok!==G.tok)return;h.th=!!t.u;G.th={mine:null,theirs:t.u?'th':null};
      if(t.u){setTimeout(()=>PB.stamp('詰めろ','ok'),big?1100:0);chime(true);}setTimeout(cpuTurn,big?900:0);});});}
function checkEnd(){const n=legalMoves(G.pos).length;
  if(n===0){const winner=G.pos.side^1;G.result={winner,why:'詰み'};G.state='end';G.busy=false;G.status='';G.showBest=false;renderPlay();
    setTimeout(()=>{if(winner===G.side){chime(true);for(let i=0;i<4;i++)setTimeout(()=>PB.burst(Math.floor(Math.random()*81),20),i*220);}},900);return true;}
  if(G.hist.length>=300){G.result={winner:-1,why:'手数制限'};G.state='end';G.busy=false;renderPlay();return true;}
  return false;}
function cpuTurn(){const tok=G.tok;G.busy=true;G.status=`CPU（${LVN[G.level][0]}）が考え中`;renderPlay();const t0=Date.now();
  ask('cpu',{sfen:toSfen(G.pos),level:G.level,ply:G.hist.length}).then(r=>{if(tok!==G.tok)return;
    const go=()=>{if(tok!==G.tok)return;const m=findMove(G.pos,r.u);if(!m){checkEnd();return;}
      m.zoneOpt=zoneOptOf(G.pos,m);const mover=G.pos.side;const ja=moveText(m,mover,lastTo());const before=toSfen(G.pos);make(G.pos,m);
      G.hist.push({sfen:before,m,ja,side:mover,user:false,evalS:toS(r.score,mover)});
      renderPlay(mvInfo(m,mover));PB.checkFx();if(checkEnd())return;userTurn();};
    const wait=Math.max(0,450-(Date.now()-t0));setTimeout(go,wait);});}
function undo(){if(G.busy)return;let i=-1;for(let k=G.hist.length-1;k>=0;k--)if(G.hist[k].user){i=k;break}if(i<0)return;G.tok++;
  G.pos=parseSfen(G.hist[i].sfen);G.hist=G.hist.slice(0,i);G.th={mine:null,theirs:null};G.state='play';G.result=null;G.view=null;userTurn();}
function resign(){if(G.state!=='play'||G.busy)return;G.tok++;G.result={winner:G.side^1,why:'投了'};G.state='end';G.showBest=false;renderPlay();}
function boardState(mv){
  const thr=[];if(G.view===null&&G.state==='play'){const ks=s=>{for(let i=0;i<81;i++)if(G.pos.b[i]===(s===0?8:-8))return i;return -1};
    if(G.th.mine==='th')thr.push(ks(G.side));if(G.th.theirs)thr.push(ks(G.side^1));}
  const sig=[toSfen(G.pos),G.view,G.showBest,G.state==='play'&&!G.busy,G.side,G.hist.length,thr.join(',')].join('|');
  if(!mv&&sig===G.bsig)return;G.bsig=sig;
  if(G.view!==null){const h=G.hist[G.view];const p=parseSfen(h.sfen);const ar=[];
    if(h.best)ar.push({from:h.best.from,to:h.best.to,drop:h.best.drop,kind:'best'});ar.push({from:h.m.from,to:h.m.to,drop:h.m.drop,kind:'played'});
    PB.set(p,{flip:G.side===1,arrows:ar,last:G.view>0?G.hist[G.view-1].m.to:-1});return;}
  const ar=[];if(G.showBest&&G.pre&&G.pre.move){const m=G.pre.move;ar.push({from:m.from,to:m.to,drop:m.drop,kind:'best'});}
  PB.set(G.pos,{flip:G.side===1,last:lastTo(),move:mv,arrows:ar,threats:thr,interactive:G.state==='play'&&!G.busy,userSide:G.side});}
PB.onMove=onUserMove;
function gradeCard(h,anim){if(!h)return `<div class="grade empty">あなたの指し手の評価がここに出る。</div>`;
  const [gl,gc]=GR[h.grade];let d=`評価値 ${fmtEval(h.evalS)}（${evalLabel(h.evalS)}）`;
  let extra='';if(h.missedMate)extra='<div class="gd">詰みを逃した</div>';
  if(h.best)extra+=`<div class="gd">最善手は <b>${h.bestJa}</b>（差 ${h.loss>9000?'大':'−'+Math.round(h.loss)}）</div>`;
  return `<div class="grade ${h.grade}${anim?' anim':''}" style="border-left-color:${gc}"><span class="gw" style="color:${gc}">${gl}</span><span class="gm">${h.ja}</span><span class="gd">${d}</span>${extra?`<span></span><div>${extra}</div>`:''}</div>`;}
function evalGraph(){const n0=G.hist.length;const vals=[0].concat(G.hist.map(h=>h.evalS??0));
  const W=360,H=168,pl=40,pr=8,pt=10,pb=22,iw=W-pl-pr,ih=H-pt-pb;const n=Math.max(30,n0);
  const X=i=>pl+i/n*iw,Y=v=>pt+(1-winPct(v))*ih,mid=pt+ih/2;
  const pts=vals.map((v,i)=>[X(i),Y(v)]);const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  const area=line+`L${pts[pts.length-1][0].toFixed(1)} ${mid}L${pl} ${mid}Z`;
  let s=`<svg class="egraph" viewBox="0 0 ${W} ${H}" role="img" aria-label="形勢グラフ"><defs><clipPath id="gtop"><rect x="${pl}" y="${pt}" width="${iw}" height="${ih/2}"/></clipPath><clipPath id="gbot"><rect x="${pl}" y="${mid}" width="${iw}" height="${ih/2}"/></clipPath></defs>`;
  s+=`<rect x="${pl}" y="${pt}" width="${iw}" height="${ih}" fill="var(--paper)"/>`;
  for(const q of [.9,.7,.3,.1]){const y=pt+(1-q)*ih;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width=".6"/>`;}
  s+=`<text x="${pl-4}" y="${pt+8}" text-anchor="end">先手</text><text x="${pl-4}" y="${mid+3}" text-anchor="end">互角</text><text x="${pl-4}" y="${pt+ih}" text-anchor="end">後手</text>`;
  for(let k=10;k<=n;k+=10)s+=`<line x1="${X(k)}" x2="${X(k)}" y1="${pt}" y2="${pt+ih}" stroke="var(--line)" stroke-width=".5"/><text x="${X(k)}" y="${H-8}" text-anchor="middle">${k}</text>`;
  if(n0){s+=`<path d="${area}" fill="#d6a656" opacity=".55" clip-path="url(#gtop)"/><path d="${area}" fill="#2b2f38" opacity=".38" clip-path="url(#gbot)"/>`;
    s+=`<line x1="${pl}" x2="${W-pr}" y1="${mid}" y2="${mid}" stroke="var(--line-strong)" stroke-width=".8" stroke-dasharray="3 3"/>`;
    s+=`<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/>`;
    G.hist.forEach((h,i)=>{const [x,y]=pts[i+1];
      if(h.user&&(h.grade==='bad'||h.grade==='dub'))s+=`<circle cx="${x}" cy="${y}" r="3.2" fill="${GR[h.grade][1]}" stroke="#fff" stroke-width="1"/>`;
      if(h.th)s+=`<path d="M${x} ${y-9}l-3.5-6h7z" fill="#c0261a"/>`;});
    const cur=G.view!==null?G.view+1:n0;const [cx,cy]=pts[cur];
    s+=`<line x1="${cx}" x2="${cx}" y1="${pt}" y2="${pt+ih}" stroke="var(--ink)" stroke-width=".8" opacity=".5"/><circle cx="${cx}" cy="${cy}" r="4" fill="var(--accent)" stroke="#fff" stroke-width="1.5"><animate attributeName="r" values="4;6;4" dur="1.6s" repeatCount="indefinite"/></circle>`;
    for(let i=1;i<=n0;i++){const w=iw/n;s+=`<rect class="hit" data-i="${i-1}" x="${X(i)-w/2}" y="${pt}" width="${w}" height="${ih}"/>`;}}
  else s+=`<text x="${pl+iw/2}" y="${mid+3}" text-anchor="middle">指し始めるとここに形勢が描かれる</text>`;
  s+='</svg>';
  const ev=n0?(G.view!==null?vals[G.view+1]:vals[n0]):0;const wp=Math.round(winPct(ev)*100);
  return `<div class="gwrap"><div class="gh"><b>形勢グラフ</b><span>推定勝率　先手 ${wp}%／後手 ${100-wp}%</span></div>${s}<div class="gtip" id="gtip">あなたは${G.side===0?'先手（上側）':'後手（下側）'}。●は疑問手・悪手、▼は詰めろがかかった手。点を押すとその局面を確認できる。</div></div>`;}
function graphSvg(){const pts=G.hist.map((h,i)=>[i+1,Math.max(-2000,Math.min(2000,h.evalS??0))]);if(pts.length<2)return '';
  const n=Math.max(40,pts.length),W=300,H=70;const X=i=>i/n*W,Y=v=>H/2-v/2000*(H/2-4);
  const d=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
  const area=d+`L${X(pts[pts.length-1][0]).toFixed(1)} ${H/2}L${X(pts[0][0]).toFixed(1)} ${H/2}Z`;
  const dots=G.hist.map((h,i)=>h.user&&(h.grade==='bad'||h.grade==='dub')?`<rect x="${X(i+1)-2}" y="${Y(pts[i][1])-2}" width="4" height="4" fill="${GR[h.grade][1]}"/>`:'').join('');
  return `<svg class="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${area}" fill="var(--accent-soft)"/><line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="3 3"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>${dots}</svg>`;}
function renderPlay(mv){const P=$('#playPanel');
  if(G.state==='setup'){if(!G.pos)G.pos=parseSfen(INITS);PB.set(G.pos,{flip:G.sidePref===1});
    P.innerHTML=`<h2>CPUと対局</h2><p>指すたびに、その手を最善手と比べて採点する。悪手のあとは「最善手」を盤上で確認できる。</p>
    <div class="lbl">あなたの手番</div><div class="seg" id="sSide">${['先手','後手','ランダム'].map((t,i)=>`<button data-v="${i}" aria-pressed="${G.sidePref===i}">${t}</button>`).join('')}</div>
    <div class="lbl">CPUの強さ</div><div class="seg" id="sLv">${[1,2,3,4,5].map(i=>`<button data-v="${i}" aria-pressed="${G.level===i}">${LVN[i][0]}</button>`).join('')}</div>
    <p class="lvdesc">${LVN[G.level][1]}</p>
    <button class="btn pri" id="sStart" style="width:100%;padding:11px">対局開始</button>
    <p class="note">評価とCPUはブラウザ内で動く自作エンジン（深さ8〜12程度の探索）。プロ用ソフトほどの精度はないので、大きな失敗に気づくための目安として使ってほしい。</p>`;
    P.querySelectorAll('#sSide button').forEach(b=>b.onclick=()=>{G.sidePref=+b.dataset.v;renderPlay()});
    P.querySelectorAll('#sLv button').forEach(b=>b.onclick=()=>{G.level=+b.dataset.v;renderPlay()});
    $('#sStart').onclick=startGame;return;}
  boardState(mv);
  const lastEval=G.hist.length?(G.hist[G.hist.length-1].evalS??0):0;
  const showH=G.view!==null?G.hist[G.view]:[...G.hist].reverse().find(h=>h.user&&h.grade);
  const fresh=showH&&showH.fresh&&G.view===null;if(showH)showH.fresh=false;
  const viewing=G.view!==null;const ev=viewing?(G.hist[G.view].evalS??0):lastEval;
  let html=`<div class="evaltxt"><span>☗先手</span><span><b>${fmtEval(ev)}</b>　${evalLabel(ev)}</span><span>☖後手</span></div><div class="evalbar"><i style="width:${winPct(ev)*100}%"></i></div>`;
  if(viewing){const h=G.hist[G.view];html+=h.user?gradeCard(h,false):`<div class="grade empty">CPUの手：${h.ja}</div>`;
    html+=`<p class="lbl">${G.view+1}手目の局面。灰色の矢印が実際の手${h.best?'、青が最善手':''}。</p>
    <div class="row"><button class="btn" id="vPrev" ${G.view===0?'disabled':''}>前の手</button><button class="btn" id="vNext" ${G.view>=G.hist.length-1?'disabled':''}>次の手</button><button class="btn pri" id="vBack">現局面に戻る</button></div>`;}
  else{if(G.state==='play'){const m=G.th.mine,t=G.th.theirs;
      html+=`<div class="kst"><div>あなたの玉<b class="${m==='check'?'chk':m==='th'?'th':''}">${m==='check'?'王手':m==='th'?'詰めろ':'安全'}</b></div><div>相手の玉<b class="${t==='win'?'win':t==='th'?'th':''}">${t==='win'?'詰みあり':t==='th'?'詰めろ':'安全'}</b></div></div>`;}
    html+=gradeCard(showH,fresh);
    if(G.state==='end'){const r=G.result;const you=r.winner===G.side;
      const um=G.hist.filter(h=>h.user&&h.grade);const cnt=k=>um.filter(h=>h.grade===k).length;const match=um.length?Math.round(cnt('best')/um.length*100):0;
      html+=`<div class="result">${r.winner<0?'引き分け':(you?'あなたの勝ち':'あなたの負け')}</div><p class="lbl">${G.hist.length}手目　${r.why}${r.winner>=0?'で'+(r.winner===0?'先手':'後手')+'の勝ち':''}（CPU：${LVN[G.level][0]}）</p>
      <div class="summary">${['best','good','norm','dub','bad'].map(k=>`<div><b style="color:${GR[k][1]}">${cnt(k)}</b><span>${GR[k][0]}</span></div>`).join('')}</div>
      <p class="lbl">最善手一致率 ${match}%。棋譜の手をタップすると、その局面と最善手を確認できる。</p>
      <div class="row"><button class="btn pri" id="gNew">新しく対局</button><button class="btn" id="gUndo">待ったして続ける</button></div>`;}
    else{html+=`<div class="status">${G.busy?'<span class="dots"><i></i><i></i><i></i></span>':''}${G.status}</div>
      <div class="row"><button class="btn" id="gHint" ${G.busy||!G.pre?'disabled':''}>${G.showBest?'ヒントを消す':'ヒント（最善手）'}</button><button class="btn" id="gUndo" ${G.busy||!G.hist.some(h=>h.user)?'disabled':''}>待った</button><button class="btn" id="gRes" ${G.busy?'disabled':''}>投了</button></div>`;}}
  html+=`<div class="kifu" id="kifu">${G.hist.map((h,i)=>`<button data-i="${i}" class="${G.view===i?'on':''}"><span class="k">${i+1}</span><span>${h.ja}${h.th?'<span class="tagth">詰めろ</span>':''}</span>${h.user&&h.grade?`<span class="tag" style="background:${GR[h.grade][1]}">${GR[h.grade][0]}</span>`:'<span></span>'}</button>`).join('')||'<p class="lbl" style="margin:8px 0">まだ指し手はない。</p>'}</div>${evalGraph()}
  ${G.state==='end'||viewing?'':`<div class="row"><button class="btn" id="gQuit">対局をやめる</button></div>`}`;
  P.innerHTML=html;
  const k=$('#kifu');if(k&&!viewing)k.scrollTop=k.scrollHeight;
  P.querySelectorAll('#kifu button').forEach(b=>b.onclick=()=>{if(G.busy)return;G.view=+b.dataset.i;renderPlay();});
  P.querySelectorAll('.egraph .hit').forEach(r=>{const i=+r.dataset.i,h=G.hist[i];
    r.onmouseenter=()=>{$('#gtip').textContent=`${i+1}手目 ${h.ja}　${fmtEval(h.evalS??0)}（${evalLabel(h.evalS??0)}）${h.grade?'　'+GR[h.grade][0]:''}${h.th?'　詰めろ':''}`;};
    r.onclick=()=>{if(G.busy)return;G.view=i;renderPlay();};});
  const on=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
  on('vPrev',()=>{G.view--;renderPlay()});on('vNext',()=>{G.view++;renderPlay()});on('vBack',()=>{G.view=null;renderPlay()});
  on('gHint',()=>{G.showBest=!G.showBest;renderPlay()});on('gUndo',undo);on('gRes',resign);
  on('gNew',()=>{G.state='setup';G.pos=null;renderPlay()});on('gQuit',()=>{G.tok++;G.busy=false;G.state='setup';G.pos=null;renderPlay()});}
renderIndex();
</script></body></html>
